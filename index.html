<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tower Defense · v1.0-alpha</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body { margin: 0; height: 100%; background: #1a1410; overflow: hidden; font-family: system-ui, sans-serif; }
      #unity-canvas { width: 100vw; height: 100vh; display: block; background: #1a1410; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #e8d3a0; }
      #bar { width: min(420px, 80vw); height: 10px; background: #3a2c20; border-radius: 5px; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #c9a227; transition: width .2s; }
      #version { position: fixed; right: 10px; bottom: 8px; color: #e8d3a0; opacity: .7; font-size: 12px; pointer-events: none; }
      #error { position: fixed; top: 0; left: 0; right: 0; background: #8b1e1e; color: #fff; padding: 10px; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="status">Baixando o jogo…</div><div id="bar"><div id="fill"></div></div></div>
    <div id="version">v1.0-alpha · 675e30b</div>
    <div id="error"></div>
    <script>
      // O GitHub recusa arquivos acima de 100 MB, então os dados vêm em partes
      // e são remontados num Blob; o loader descompacta o Brotli sozinho (Decompression Fallback).
      const DATA_PARTS = ["Build/WebGL.data.part0", "Build/WebGL.data.part1"];
      const fill = document.getElementById("fill");
      const status = document.getElementById("status");

      function showError(msg) {
        const el = document.getElementById("error");
        el.textContent = msg;
        el.style.display = "block";
      }

      async function downloadData() {
        const sizes = await Promise.all(DATA_PARTS.map(async url => {
          const r = await fetch(url, { method: "HEAD" });
          return Number(r.headers.get("content-length")) || 0;
        }));
        const total = sizes.reduce((a, b) => a + b, 0) || 1;
        let loaded = 0;
        const blobs = [];
        for (const url of DATA_PARTS) {
          const response = await fetch(url);
          if (!response.ok) throw new Error("Falha ao baixar " + url + " (" + response.status + ")");
          const reader = response.body.getReader();
          const chunks = [];
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded += value.length;
            fill.style.width = (60 * loaded / total) + "%";
            status.textContent = "Baixando o jogo… " + Math.round(loaded / 1048576) + " de " + Math.round(total / 1048576) + " MB";
          }
          blobs.push(new Blob(chunks));
        }
        return URL.createObjectURL(new Blob(blobs));
      }

      async function start() {
        const dataUrl = await downloadData();
        status.textContent = "Preparando…";
        const config = {
          dataUrl: dataUrl,
          frameworkUrl: "Build/WebGL.framework.js.unityweb",
          codeUrl: "Build/WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Guine",
          productName: "Tower Defense",
          productVersion: "v1.0-alpha",
          showBanner: (msg, type) => { if (type === "error") showError(msg); },
        };
        const canvas = document.getElementById("unity-canvas");
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "Build/WebGL.loader.js";
          script.onload = resolve;
          script.onerror = () => reject(new Error("Falha ao carregar o loader"));
          document.body.appendChild(script);
        });
        await createUnityInstance(canvas, config, p => { fill.style.width = (60 + 40 * p) + "%"; });
        document.getElementById("loading").style.display = "none";
        canvas.focus();
      }

      start().catch(e => showError("Erro ao iniciar: " + (e && e.message ? e.message : e)));
    </script>
  </body>
</html>
